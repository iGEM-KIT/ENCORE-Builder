# One file, two ways to use it:
#   docker compose up --build   builds both images from this repository
#   docker compose up           pulls the ready-made images from Docker Hub (no build)
services:
  app:
    image: igemkit/encore-builder:latest
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - commec
    environment:
      # Points at the commec sidecar below by its Compose service name.
      # Override with your own COMMEC_URL if you're running commec-service
      # elsewhere.
      - COMMEC_URL=${COMMEC_URL:-http://commec:8787}

  # Biosecurity screening sidecar (COMMEC, "Common Mechanism", IBBIS); starts
  # by default with plain `docker compose up`, so screening can't accidentally
  # be skipped. Downloads the commec databases (~1.2GB) on its first start (see
  # commec-service/README.md), so the first `docker compose up --build` takes
  # a while longer. Not meant to be a tamper-proof gate (it's self-hosted,
  # open-source software: a determined user could still disable it locally),
  # just the honest default so normal usage always includes the check.
  # commec 1.0.4 is used because it is the newest version that installs on every
  # platform (Windows, Linux, Mac incl. Apple Silicon), so no platform pin here.
  commec:
    image: igemkit/encore-builder-commec:latest
    build: ./commec-service
    ports:
      - "8787:8787"
    environment:
      # Only the biorisk list is checked: without the NR/NT taxonomy databases the
      # taxonomy steps must be skipped, or commec errors.
      - COMMEC_SKIP_TAXONOMY=true
    volumes:
      # the databases (about 1.2GB) are downloaded on the first start and kept here
      - commec-db:/databases
    restart: unless-stopped

volumes:
  commec-db:
