services:
  app:
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      # Points at the commec sidecar below by its Compose service name —
      # resolves fine even when that container isn't running (plain
      # `docker compose up`, no profile): the health check just fails
      # gracefully and screening shows as "off". Override with your own
      # COMMEC_URL if you're running commec-service elsewhere.
      - COMMEC_URL=${COMMEC_URL:-http://commec:8787}

  # Biosecurity screening sidecar (COMMEC v2 / "Common Mechanism", IBBIS) —
  # NOT started by `docker compose up` on its own. It needs ~40GB of reference
  # databases and takes a while to build/download, so it's opt-in via a
  # profile: `docker compose --profile biosecurity up --build`. See
  # README.md "Biosecurity screening" before enabling this.
  commec:
    build: ./commec-service
    profiles: ["biosecurity"]
    ports:
      - "8787:8787"
    restart: unless-stopped
