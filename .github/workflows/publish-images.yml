# Builds the two Docker images of the ENCORE-Builder for linux/amd64 and linux/arm64
# and publishes them to the GitHub Container Registry (ghcr.io) and to Docker Hub:
#   ghcr.io/igem-kit/encore-builder          the builder (Nuxt server + Python engine)
#   ghcr.io/igem-kit/encore-builder-commec   the biosecurity screening container
#   igemkit/encore-builder, igemkit/encore-builder-commec   the same images on Docker Hub
# Runs on every push to main, on version tags (v1.2.3) and by hand from the Actions tab.
# After the first run, set both packages to "public" on GitHub (Packages > Package
# settings > Change visibility) so that everybody can pull them without logging in.
name: Publish Docker images

on:
  push:
    branches: [main]
    # a change of documents only does not need new images
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The images are only built when all tests pass.
  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: encore-builder
            context: .
          - name: encore-builder-commec
            context: ./commec-service
    steps:
      - uses: actions/checkout@v7

      # QEMU lets the amd64 runner build the arm64 variant (Apple Silicon, Raspberry Pi 4/5).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
      # access token with Read & Write permission).
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The owner has to be lower case in an image name (iGEM-KIT becomes igem-kit).
      # Every image goes to both registries.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
            docker.io/igemkit/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Shows a short description with a link to the instructions on the Docker Hub pages.
  # Needs a token that may edit repositories; a failure here never blocks the images.
  description:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [encore-builder, encore-builder-commec]
    steps:
      - uses: actions/checkout@v7
      - uses: peter-evans/dockerhub-description@v5
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: igemkit/${{ matrix.name }}
          short-description: "ENCORE-Builder (iGEM KIT): design tool for encapsulin cargo constructs with Golden Gate cloning."
          readme-filepath: .github/dockerhub-${{ matrix.name }}.md
