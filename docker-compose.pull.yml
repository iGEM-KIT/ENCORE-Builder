# Download only this one file to run the ENCORE-Builder without the rest of the repository.
# It pulls the ready-made images from the GitHub Container Registry; nothing is built.
#   docker compose -f docker-compose.pull.yml up
# (name the file docker-compose.yml and plain `docker compose up` works as well)
services:
  app:
    image: ghcr.io/igem-kit/encore-builder:latest
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - commec
    environment:
      - COMMEC_URL=${COMMEC_URL:-http://commec:8787}

  # Biosecurity screening (COMMEC). Downloads its databases (about 1.2 GB) on the first start
  # into the volume below, so later starts are fast.
  commec:
    image: ghcr.io/igem-kit/encore-builder-commec:latest
    ports:
      - "8787:8787"
    environment:
      - COMMEC_SKIP_TAXONOMY=true
    volumes:
      - commec-db:/databases
    restart: unless-stopped

volumes:
  commec-db:
